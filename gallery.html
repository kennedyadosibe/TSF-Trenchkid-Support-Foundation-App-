<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Trenchkid Support Foundation</title>
  <link rel="icon" href="images/tsf-logo.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .gallery-toolbar { display: flex; justify-content: center; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .gallery-filter { border: 2px solid var(--gray-light); background: var(--white); color: var(--gray); border-radius: 20px; padding: 0.45rem 1rem; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: var(--transition); }
    .gallery-filter.active, .gallery-filter:hover { background: var(--blue); border-color: var(--blue); color: var(--white); }
    .gallery-page-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.3rem; }
    .gallery-card { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); }
    .gallery-card:hover { transform: translateY(-5px); box-shadow: 0 20px 50px rgba(26,63,163,0.16); }
    .gallery-card img { width: 100%; height: 240px; object-fit: cover; display: block; background: var(--gray-light); }
    .gallery-card-body { padding: 1.2rem 1.3rem; }
    .gallery-card h3 { font-family: 'Playfair Display', serif; font-size: 1.08rem; color: var(--blue-dark); margin-bottom: 0.4rem; }
    .gallery-card p { color: var(--gray); font-size: 0.88rem; line-height: 1.65; }
    .gallery-tag { display: inline-block; margin-bottom: 0.7rem; color: var(--blue); background: rgba(26,63,163,0.08); border-radius: 20px; padding: 0.2rem 0.7rem; font-size: 0.72rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .empty-gallery { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; color: var(--gray); padding: 3rem 1.5rem; }
    @media(max-width:900px) { .gallery-page-grid { grid-template-columns: repeat(2, 1fr); } }
    @media(max-width:560px) { .gallery-page-grid { grid-template-columns: 1fr; } .gallery-card img { height: 220px; } }
  </style>
</head>
<body>
  <div class="page-hero" data-setting-bg="gallery_hero_image">
    <div class="page-hero-content">
      <div class="breadcrumb"><a href="index.html">Home</a> &gt; Gallery</div>
      <h1 data-setting="gallery_hero_title">Gallery</h1>
      <p data-setting="gallery_hero_body">Moments from TSF programs, outreach, mentorship, and community support work.</p>
    </div>
  </div>

  <section>
    <div class="container">
      <div class="section-header fade-up">
        <div class="section-label">Our Work in Pictures</div>
        <h2 class="section-title" data-setting="gallery_section_title">TSF <span>Gallery</span></h2>
        <p class="section-desc" data-setting="gallery_section_body">Browse snapshots from the communities, children, and volunteers behind the mission.</p>
      </div>
      <div class="gallery-toolbar" id="gallery-filters"></div>
      <div class="gallery-page-grid" id="gallery-grid"></div>
      <div class="empty-gallery" id="gallery-empty" style="display:none">No gallery photos have been published yet.</div>
    </div>
  </section>

  <script src="js/time.js"></script>
  <script src="js/components.js"></script>
  <script>
    let galleryItems = [];
    let activeCategory = 'All';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function renderFilters() {
      const categories = ['All', ...new Set(galleryItems.map(item => item.category || 'General'))];
      document.getElementById('gallery-filters').innerHTML = categories.map(cat =>
        `<button type="button" class="gallery-filter ${cat === activeCategory ? 'active' : ''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`
      ).join('');
      document.querySelectorAll('.gallery-filter').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          renderGallery();
          renderFilters();
        });
      });
    }

    function renderGallery() {
      const grid = document.getElementById('gallery-grid');
      const empty = document.getElementById('gallery-empty');
      const items = activeCategory === 'All' ? galleryItems : galleryItems.filter(item => (item.category || 'General') === activeCategory);
      empty.style.display = items.length ? 'none' : 'block';
      grid.innerHTML = items.map(item => `
        <article class="gallery-card fade-up visible">
          <img src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.title)}">
          <div class="gallery-card-body">
            <span class="gallery-tag">${escapeHtml(item.category || 'General')}</span>
            <h3>${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(item.caption || '')}</p>
          </div>
        </article>
      `).join('');
    }

    async function loadGallery() {
      try {
        const res = await fetch('BACKEND/gallery.php', { credentials: 'same-origin' });
        const data = await res.json();
        galleryItems = data.success ? data.items : [];
      } catch (_) {
        galleryItems = [];
      }
      renderFilters();
      renderGallery();
    }
    loadGallery();
  </script>
</body>
</html>
